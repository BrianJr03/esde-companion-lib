[versions]
# Build Tools & Plugins
agp = "8.11.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"

# AndroidX Core
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.10.0"
lifecycleViewmodelCompose = "2.10.0"
lifecycleRuntimeCompose = "2.10.0"

# Compose Navigation
navigationCompose = "2.9.7"

# Image Loading - Coil (version 2.x)
coilCompose = "2.7.0"
coilGif = "2.7.0"
coilSvg = "2.7.0"

# Media3
media3Exoplayer = "1.9.1"
media3Ui = "1.9.1"

# DataStore
datastorePreferences = "1.2.0"

# DocumentFile
documentfileVersion = "1.1.0"

# Dependency Injection - Hilt
hiltAndroid = "2.56.2"
hiltCompiler = "2.56.2"
hiltNavigationCompose = "1.3.0"

# Testing
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

# Room Database
room = "2.8.4"

# Networking - Retrofit & OkHttp
retrofit = "3.0.0"
okhttp = "5.3.2"
gson = "2.13.2"

# API & Data
igdbApi = "1.3.2"
protobuf = "4.33.5"

# Audio Processing
tarsosDsp = "2.4.1"

# UI Libraries
androidSvg = "1.4"
shimmer = "0.5.0"
reorderable = "0.9.6"

[libraries]
# AndroidX Core
androidx-core-ktx-v1170 = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx-v294 = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose-v294 = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose-v294 = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }

# Compose UI
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Navigation
androidx-navigation-compose-v297 = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Image Loading - Coil
coil-kt-coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
coil-kt-coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coilGif" }
coil-kt-coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coilSvg" }

# Media3
androidx-media3-exoplayer-v191 = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-media3-ui-v191 = { module = "androidx.media3:media3-ui", version.ref = "media3Ui" }

# DataStore
androidx-datastore-preferences-v120 = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }

# DocumentFile
androidx-documentfile-v110 = { module = "androidx.documentfile:documentfile", version.ref = "documentfileVersion" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hiltCompiler" }
androidx-hilt-navigation-compose-v130 = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit-v130 = { module = "androidx.test.ext:junit", version.ref = "junitVersion" }
androidx-espresso-core-v370 = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

# Room Database
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Networking - Retrofit & OkHttp
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# API & Data
igdb-api = { module = "io.github.husnjak:igdb-api-jvm", version.ref = "igdbApi" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

# Audio Processing
tarsos-dsp = { module = "com.github.st-h:TarsosDSP", version.ref = "tarsosDsp" }

# UI Libraries
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidSvg" }
shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }
reorderable = { module = "org.burnoutcrew.composereorderable:reorderable", version.ref = "reorderable" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
